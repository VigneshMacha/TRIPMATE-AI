services:
  - type: web
    name: tripmate-ai
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AVIATION_STACK_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: GROQ_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: MISTRAL_MAX_OUTPUT_TOKENS
        value: "1000"

